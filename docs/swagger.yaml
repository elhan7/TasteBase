openapi: 3.0.0
info:
  title: TasteBase API
  description: API для управления книгой рецептов
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /recipes:
    get:
      summary: Получить все рецепты
      responses:
        '200':
          description: Список рецептов
    post:
      summary: Добавить новый рецепт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Recipe'
      responses:
        '201':
          description: Рецепт создан
  /recipes/random:
    get:
      summary: Получить случайный рецепт
      responses:
        '200':
          description: Случайный рецепт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
components:
  schemas:
    Recipe:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        ingredients:
          type: array
          items:
            type: string
        instruction:
          type: string